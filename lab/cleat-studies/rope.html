<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cleat study 1 — The mooring rope</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .brick{position:absolute;inset:-4%;background:url(brick.jpg) center/620px auto repeat;
    filter:sepia(.35) saturate(.9) brightness(.78) contrast(1.1);
    -webkit-mask-image:radial-gradient(ellipse 42% 36% at 50% 50%,#000 0%,rgba(0,0,0,.55) 40%,transparent 72%);
            mask-image:radial-gradient(ellipse 42% 36% at 50% 50%,#000 0%,rgba(0,0,0,.55) 40%,transparent 72%);
    opacity:0}
  .glow{position:absolute;left:50%;top:50%;width:min(110vw,1200px);aspect-ratio:2.3/1;transform:translate(-50%,-50%);
    border-radius:50%;filter:blur(24px);opacity:0;
    background:radial-gradient(ellipse at center,rgba(254,230,181,.62) 0%,rgba(248,207,149,.3) 30%,rgba(185,124,60,.12) 55%,transparent 74%)}
  #cleat *{fill:none;stroke-width:17;stroke-linecap:round;stroke-linejoin:round}
  #tipcover path{fill:var(--ink);stroke-width:17}
  #rope path{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .r-shadow{stroke:rgba(0,0,0,.55)}
  .r-base{stroke:var(--brass)}
  .r-lay{stroke:var(--halo-warm);stroke-dasharray:5 8;opacity:.6}
  .r-core{stroke:var(--brass-deep);opacity:.55}
</style>
</head>
<body>
<p class="caption"><b>1 · The mooring rope.</b> The gold line becomes a rope and ties the real cleat hitch: under a
horn, a figure-eight over the top, a locking turn. It pulls taut, the frame tugs like a boat settling, and the cleat
lights from the tension. <i>Things dock here.</i></p>

<div class="scroller"><div class="stage">
  <div class="brick" id="brick"></div>
  <div class="glow" id="glow"></div>

  <svg class="scene" id="scene" viewBox="-500 -150 2000 640" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <mask id="reveal" maskUnits="userSpaceOnUse" x="-600" y="-200" width="2200" height="800">
        <path id="revealPath" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round" pathLength="1"/>
      </mask>
      <!-- the gold line: grows from the centre like the rule, then runs off to the boat -->
      <clipPath id="leadclip"><rect id="leadrect" x="500" y="150" width="0" height="100"/></clipPath>
      <clipPath id="tips"><rect x="-40" y="-20" width="110" height="140"/><rect x="930" y="-20" width="110" height="140"/></clipPath>
      <filter id="lit" x="-20%" y="-60%" width="140%" height="220%">
        <feGaussianBlur stdDeviation="9" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g id="world">
      <g id="cleat" filter="url(#lit)"></g>
      <g id="rope">
        <g class="strand" clip-path="url(#leadclip)" data-d="lead">
          <path class="r-shadow" transform="translate(4 7)"/><path class="r-base"/><path class="r-lay"/><path class="r-core"/>
        </g>
        <g class="strand" mask="url(#reveal)" data-d="knot">
          <path class="r-shadow" transform="translate(4 7)"/><path class="r-base"/><path class="r-lay"/><path class="r-core"/>
        </g>
      </g>
      <g id="tipcover" clip-path="url(#tips)"></g>
    </g>
  </svg>

  <div class="layer est-layer"><div><div class="est">EST<b>.</b> 1857</div><div class="rule"></div></div></div>

  <div class="layer inside" style="opacity:0">
    <video muted playsinline loop preload="auto" src="../../assets/video/arrive.mp4" poster="../../assets/video/arrive_poster.jpg"></video>
    <div class="grade"></div>
    <div class="pillars"><span>WORK</span><span>MEET</span><span>CREATE</span><span>CONNECT</span><span>BELONG</span></div>
  </div>
</div></div>

<script type="module">
import { run, ramp, easeOut, easeInOut, lerp, mix, CLEAT } from './shared.js';
import { PARTS, HORN } from './cleat.js';

// The gold line lies where the prototype's rule sits and runs off to the right (to the boat).
// From its left end the rope dives under the plinth, climbs beside the stem, then: under the left horn, round its tip, a figure-eight
// across the top, round the right tip, back across, and a locking turn over the left horn.
const LEAD = 'M 1600 200 L 180 200';
const KNOT = 'M 180 200' +
  ' C 260 200, 330 250, 340 300 C 350 340, 470 336, 470 262 C 470 170, 470 112, 430 98' +
  ' C 330 98, 130 104, 72 100 C 14 96, 10 36, 72 34' +
  ' C 300 30, 700 98, 928 98 C 992 98, 994 34, 928 32' +
  ' C 700 30, 300 98, 132 98 C 68 98, 58 48, 122 44 C 196 40, 232 58, 262 74';

const cleat = document.getElementById('cleat');
cleat.innerHTML = PARTS;
document.getElementById('tipcover').innerHTML = `<path d="${HORN}"/>`;
const ropePaths = [...document.querySelectorAll('#rope path')];
document.querySelectorAll('.strand').forEach((g) =>
  g.querySelectorAll('path').forEach((p) => p.setAttribute('d', g.dataset.d === 'lead' ? LEAD : KNOT)));
const reveal = document.getElementById('revealPath');
reveal.setAttribute('d', KNOT);
reveal.style.strokeDasharray = '1 1';
const leadrect = document.getElementById('leadrect');

const world = document.getElementById('world');
const stage = document.querySelector('.stage');
const glow = document.getElementById('glow');
const brick = document.getElementById('brick');
const tipcover = document.getElementById('tipcover');

run((p) => {
  const t = ramp(p, ...CLEAT);

  // the line thickens into rope as EST fades
  const thick = easeOut(ramp(p, 0.07, 0.16));
  const w = lerp(1.5, 16, thick);
  ropePaths.forEach((el) => {
    const c = el.getAttribute('class');
    el.style.strokeWidth = c === 'r-shadow' ? w + 4 : c === 'r-core' ? Math.max(1, w * 0.18) : w;
    if (c === 'r-lay') el.style.opacity = String(0.6 * thick);
  });

  // draw: the line appears exactly where the rule does (from the centre), runs off to the
  // right as it thickens, then the scroll ties the knot from its left end
  const grow = easeOut(ramp(p, 0.015, 0.09));
  const half = 320 * grow;
  const pay = easeInOut(ramp(p, 0.09, 0.2));
  leadrect.setAttribute('x', String(500 - half));
  leadrect.setAttribute('width', String(2 * half + 800 * pay));
  const knot = easeInOut(ramp(t, 0.14, 0.7));
  reveal.style.strokeDashoffset = String(1 - knot);
  document.querySelector('.rule').style.opacity = String(1 - thick);

  // the cleat: dark cast iron until the rope is made fast
  const lit = easeOut(ramp(t, 0.72, 0.9));
  const iron = ramp(t, 0.1, 0.24);
  cleat.style.stroke = mix('#3c3531', '#EFE7DA', lit);
  cleat.style.opacity = String(iron);
  tipcover.style.opacity = String(iron);
  tipcover.style.stroke = cleat.style.stroke;
  cleat.setAttribute('filter', lit > 0.02 ? 'url(#lit)' : '');
  document.getElementById('rope').style.filter = `brightness(${1 + 0.35 * lit})`;

  // the tug: the knot takes the strain and the whole frame settles
  const tug = ramp(t, 0.68, 0.8);
  const pull = Math.sin(tug * Math.PI) * (1 - tug * 0.5);
  world.setAttribute('transform', `translate(${-16 * pull} ${3 * pull})`);
  stage.style.transform = `translateY(${4 * Math.sin(tug * Math.PI * 3) * (1 - tug)}px)`;

  // light from the tension, brick in the halo
  glow.style.opacity = String(lit);
  brick.style.opacity = String(0.6 * lit);

  // push through into the building
  const push = easeInOut(ramp(p, 0.8, 0.93));
  const s = 1 + 1.6 * push;
  for (const el of [document.getElementById('scene'), glow, brick]) {
    el.style.transform = (el === glow ? 'translate(-50%,-50%) ' : '') + `scale(${s})`;
    el.style.opacity = String((el === glow ? lit : el === brick ? 0.6 * lit : 1) * (1 - ramp(p, 0.82, 0.89)));
  }
});
</script>
</body>
</html>
